<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animal 3D Database</title>

    <meta
        name="description"
        content="動物標本の3Dモデルを閲覧・ダウンロードできるデータベース"
    >

    <link rel="stylesheet" href="css/style.css">

    <!-- 3D表示 -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>
</head>

<body>

<header class="site-header">
    <div class="header-inner">
        <h1>Animal 3D Database</h1>
        <p>動物標本3Dモデルデータベース</p>
    </div>
</header>

<main>

    <!-- 検索 -->
    <section class="search-section">

        <input
            type="search"
            id="searchInput"
            placeholder="動物名・標本番号で検索..."
        >

    </section>

    <!-- カテゴリ -->
    <nav class="categories">

        <button class="category-btn active" data-category="all">
            すべて
        </button>

        <button class="category-btn" data-category="bear">
            クマ
        </button>

        <button class="category-btn" data-category="fox">
            キツネ
        </button>

        <button class="category-btn" data-category="raccoon-dog">
            タヌキ
        </button>

        <button class="category-btn" data-category="deer">
            シカ
        </button>

    </nav>

    <!-- 標本一覧 -->
    <section>

        <div id="specimenGrid" class="specimen-grid">
            <!-- JavaScriptで自動生成 -->
        </div>

        <p id="noResults" class="no-results hidden">
            該当する標本がありません。
        </p>

    </section>

</main>

<!-- 3D表示モーダル -->
<div id="viewerModal" class="modal hidden">

    <div class="modal-content">

        <button id="closeModal" class="close-button">
            ×
        </button>

        <div class="viewer-area">

            <model-viewer
                id="modelViewer"
                camera-controls
                auto-rotate
                shadow-intensity="1"
                exposure="1"
                environment-image="neutral"
                ar
                alt="3Dモデル">
            </model-viewer>

        </div>

        <div class="model-information">

            <h2 id="modalTitle"></h2>

            <p id="modalScientificName"></p>

            <dl>

                <div>
                    <dt>標本番号</dt>
                    <dd id="modalId"></dd>
                </div>

                <div>
                    <dt>部位</dt>
                    <dd id="modalPart"></dd>
                </div>

                <div>
                    <dt>採取地</dt>
                    <dd id="modalLocation"></dd>
                </div>

                <div>
                    <dt>備考</dt>
                    <dd id="modalDescription"></dd>
                </div>

            </dl>

            <div class="download-area">

                <h3>3Dプリント用データ</h3>

                <div id="downloadButtons"></div>

            </div>

        </div>

    </div>

</div>

<footer>

    <p>
        Animal 3D Database
    </p>

    <p>
        Educational / Research Project
    </p>

</footer>

<script src="js/app.js"></script>

</body>
</html>
