<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Animal 3D Database</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Google Model Viewer -->
    <script
        type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js">
    </script>
</head>

<body>

    <!-- =========================
         Header
    ========================== -->
    <header class="site-header">
        <div class="container">
            <h1>Animal 3D Database</h1>
            <p>動物標本3Dデータベース</p>
        </div>
    </header>


    <!-- =========================
         Main
    ========================== -->
    <main class="container">

        <!-- Search -->
        <section class="search-section">

            <input
                type="search"
                id="searchInput"
                placeholder="標本名・学名・IDなどを検索"
                autocomplete="off"
            >

        </section>


        <!-- Category -->
        <section class="filter-section">

            <h2>カテゴリー</h2>

            <div
                id="categoryButtons"
                class="filter-buttons">
            </div>

        </section>


        <!-- Species -->
        <section class="filter-section">

            <h2>種類</h2>

            <div
                id="speciesButtons"
                class="filter-buttons">
            </div>

        </section>


        <!-- Specimens -->
        <section class="specimens-section">

            <div
                id="specimenGrid"
                class="specimen-grid">
            </div>

        </section>

    </main>


    <!-- =========================
         Footer
    ========================== -->
    <footer class="site-footer">

        <div class="container">

            <p>
                Animal 3D Database
            </p>

        </div>

    </footer>


    <!-- =========================
         JavaScript
    ========================== -->
    <script src="js/app.js"></script>

</body>
</html>
